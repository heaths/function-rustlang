# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/azure-dev-cli_1.0.1/schemas/v1.0/azure.yaml.json
name: function-rustlang
requiredVersions:
  azd: '>= 1.10.1'

metadata:
  template: function-rustlang

hooks:
  postrestore:
    shell: sh
    interactive: true
    run: |
      az --version

  predeploy:
    shell: sh
    interactive: true
    run: |
      cargo build --release --target x86_64-unknown-linux-musl
      zip deploy.zip host.json hello/function.json target/x86_64-unknown-linux-musl/release/handler
      az storage blob upload --blob-endpoint "$AZURE_STORAGE_URL" --container-name production --auth-mode login --file deploy.zip --overwrite
      echo "Running on $AZURE_FUNCTIONAPP_URL"

  postup:
    shell: sh
    interactive: true
    run: |
      curl $AZURE_FUNCTIONAPP_URL/api/hello
